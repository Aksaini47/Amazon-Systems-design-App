// App-level build.gradle for the RepairFully camera Flutter app
plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
    // ─── Firebase plugins (enabled 2026-05-17 — google-services.json present) ─
    // google-services parses google-services.json + injects Firebase config
    // into Android resources at build time. crashlytics maps Dart obfuscated
    // symbols to readable stack traces in the Firebase console.
    id "com.google.gms.google-services"
    id "com.google.firebase.crashlytics"
}

// ─── Release signing — load credentials from key.properties ───────────────
// key.properties lives in /android/ (gitignored). Format:
//   storePassword=...
//   keyPassword=...
//   keyAlias=...
//   storeFile=repairfully-dev.jks
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "com.repairfully.logger"
    compileSdk = 36
    ndkVersion = "27.1.12297006"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId "com.repairfully.logger"
        // Camera package requires minSdk 21
        minSdkVersion = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName

        multiDexEnabled true
    }

    signingConfigs {
        release {
            // The Kotlin DSL version of build.gradle uses the same lookup;
            // these `?:` fallbacks keep CI green if key.properties is absent
            // (signing then falls back to debug).
            if (keystorePropertiesFile.exists()) {
                keyAlias = keystoreProperties['keyAlias']
                keyPassword = keystoreProperties['keyPassword']
                storeFile = keystoreProperties['storeFile'] ? rootProject.file(keystoreProperties['storeFile']) : null
                storePassword = keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            // DELIBERATE (2026-07-17): key.properties does not exist, so release
            // builds sign with the machine's debug keystore. This is the shipped
            // signature on the single production phone — changing it would force
            // an uninstall (wiping captured media). The debug keystore is backed
            // up at C:\RF-Logger-Backups\. If a Play Store path ever opens,
            // create a real keystore + key.properties and plan a migration.
            signingConfig = keystorePropertiesFile.exists() ? signingConfigs.release : signingConfigs.debug
            // Keep R8 off for now — many Flutter plugins (camera, ML Kit,
            // mobile_scanner) need proguard rules we haven't audited yet.
            // Enable in a separate CR with full proguard-rules.pro pass.
            minifyEnabled false
            shrinkResources false
        }
    }
}

flutter {
    source "../.."
}
