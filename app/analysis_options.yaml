# Static analysis config for RF Logger.
#
# Base: flutter_lints (recommended set). Additions below raise the bar for
# async safety and dead-code hygiene — the two failure classes this codebase
# has actually shipped bugs from. Run locally with `flutter analyze`;
# CI runs it on every push (.github/workflows/app-ci.yml).

include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true

linter:
  rules:
    # Async safety — unawaited futures and context-across-gaps are how the
    # capture flow breaks in the field.
    unawaited_futures: true
    discarded_futures: false  # too noisy with fire-and-forget UI handlers; revisit
    # Hygiene
    prefer_final_locals: true
    prefer_final_in_for_each: true
    avoid_redundant_argument_values: true
    unnecessary_lambdas: true
    unnecessary_parenthesis: true
    # Documentation honesty — comments that lie are worse than none.
    comment_references: true
